# Offline CI — no live API spend by default.
# Live/spend probes are opt-in via workflow_dispatch inputs or the `live-smoke` label.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: "Opt-in live Agent Control / API smoke (spends keys; needs secrets)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-smoke:
    name: Offline preflight + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps (app + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # DizzyGraph package for control-plane / otel unit tests
          pip install -e ".[dev,control]"

      - name: Offline preflight (no API spend)
        env:
          # Placeholders only — preflight checks presence, never calls live APIs.
          OPENAI_API_KEY: sk-ci-placeholder-not-real
          GALILEO_API_KEY: galileo-ci-placeholder-not-real
          # Ensure CI uses canonical names (not Galileo_API_Key).
          Galileo_API_Key: ""
        run: python app.py --preflight

      - name: Pytest (offline unit / smoke)
        env:
          OPENAI_API_KEY: sk-ci-placeholder-not-real
          GALILEO_API_KEY: galileo-ci-placeholder-not-real
          # Block accidental live spend in unit tests
          GALILEO_PREFLIGHT_LIVE: "0"
          DIZZY_SKIP_DOTENV: "1"
        run: pytest -q

  live-smoke:
    name: Live smoke (opt-in, may spend)
    # Default CI never runs this. Enable via workflow_dispatch or PR label `live-smoke`.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_live_smoke == true) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'live-smoke'))
    runs-on: ubuntu-latest
    needs: offline-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Live Agent Control probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GALILEO_API_KEY: ${{ secrets.GALILEO_API_KEY }}
          AGENT_CONTROL_URL: https://api.galileo.ai/agent-control
          GALILEO_PREFLIGHT_LIVE: "1"
        run: |
          if [ -z "${OPENAI_API_KEY}" ] || [ -z "${GALILEO_API_KEY}" ]; then
            echo "LIVE SMOKE SKIP: repository secrets OPENAI_API_KEY / GALILEO_API_KEY not set."
            echo "Do not invent keys. Re-run after adding exact-name secrets."
            exit 0
          fi
          python app.py --preflight-live
